name: Post Instagram Story

on:
  schedule:
    # Runs every day at 16:00 UTC (~5pm UK time in winter, 4pm in summer since
    # GitHub Actions cron doesn't adjust for daylight saving). Edit the minute/hour
    # below to change the time. The script works out which day of the 12-day loop
    # it is and posts that day's slides.
    - cron: "0 16 * * *"
  workflow_dispatch:  # run it by hand from the Actions tab, for testing
    inputs:
      cycle_day:
        description: "Post a specific day of the loop (1-12) instead of today's. Leave blank for today's."
        required: false
        default: ""

permissions:
  contents: write  # so the run can commit data/posts.jsonl back to the repo

concurrency:
  group: story-data  # never let this and the insights collector commit at the same moment
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run poster
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_BASE_URL: ${{ secrets.IMAGE_BASE_URL }}
          # Instagram login path (instagram_business_* scopes). Change to
          # graph.facebook.com if the Meta app is set up for Facebook login instead.
          GRAPH_HOST: "graph.instagram.com"
          CYCLE_START_DATE: "2026-09-04"  # the date that counts as Day 1 of the loop
          CYCLE_DAY_OVERRIDE: ${{ inputs.cycle_day }}
        run: python post_story.py

      - name: Save post log to the repo
        if: always()  # even if the second slide failed, record the one that went live
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Nothing new to save."
            exit 0
          fi
          git commit -m "Record story posts for $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
